<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
<title id="t">Van balletje B01 naar een deur met drie sleutels</title>
<desc id="d">Links: B01 heeft voorraad 1, uitlenen maakt die 0, bij 0 lukt het niet. Rechts: speler P01 heeft drie sleutels en een gesloten deur. Openen maakt deurOpen waar; met twee sleutels blijft de deur dicht.</desc>
<rect width="900" height="400" rx="22" fill="#f3f8fc"/>
<text x="34" y="47" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#173b5a">Dezelfde aanpak, andere gegevens en regel</text>
<rect x="30" y="75" width="395" height="270" rx="16" fill="#fff" stroke="#9dbbd0" stroke-width="2"/>
<rect x="475" y="75" width="395" height="270" rx="16" fill="#fff" stroke="#9dbbd0" stroke-width="2"/>
<circle cx="75" cy="120" r="25" fill="#ffd447" stroke="#173b5a" stroke-width="5"/>
<text x="115" y="128" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#173b5a">B01 uitlenen</text>
<text x="54" y="178" font-family="Arial, sans-serif" font-size="18" fill="#173b5a">Gegevens: code B01, voorraad 1</text>
<text x="54" y="221" font-family="Arial, sans-serif" font-size="18" fill="#173b5a">Actie: uitlenen</text>
<text x="54" y="264" font-family="Arial, sans-serif" font-size="18" fill="#173b5a">Regel: alleen als voorraad 1 is</text>
<text x="54" y="313" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#176a46">1 → 0, bij 0 blijft het 0</text>
<text x="435" y="217" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#176a46">→</text>
<rect x="504" y="98" width="42" height="45" rx="7" fill="#ffd447" stroke="#173b5a" stroke-width="3"/>
<circle cx="525" cy="117" r="5" fill="#173b5a"/>
<text x="562" y="128" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#173b5a">Deur openen</text>
<text x="499" y="178" font-family="Arial, sans-serif" font-size="18" fill="#173b5a">Gegevens: 3 sleutels, deur dicht</text>
<text x="499" y="221" font-family="Arial, sans-serif" font-size="18" fill="#173b5a">Actie: openen</text>
<text x="499" y="264" font-family="Arial, sans-serif" font-size="18" fill="#173b5a">Regel: 3 of meer sleutels nodig</text>
<text x="499" y="313" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#176a46">Dicht → open, bij 2 blijft dicht</text>
<text x="34" y="378" font-family="Arial, sans-serif" font-size="17" fill="#173b5a">De sleutels blijven 3. Alleen de toestand van de deur verandert.</text>
</svg>