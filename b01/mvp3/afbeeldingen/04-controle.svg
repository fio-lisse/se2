<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="t d"><title id="t">Twee vensters controleren dezelfde voorraad</title><desc id="d">Twee vereenvoudigde webappvensters. Na uitlenen tonen beide na vernieuwen voorraad nul; nogmaals uitlenen geeft Niet beschikbaar.</desc><rect width="900" height="330" rx="18" fill="#f1f6fa"/><rect x="26" y="24" width="848" height="280" rx="12" fill="#fff" stroke="#a8bece" stroke-width="2"/><rect x="26" y="24" width="848" height="45" rx="12" fill="#173b5a"/><circle cx="52" cy="46" r="6" fill="#ffd447"/><circle cx="72" cy="46" r="6" fill="#8fc6e8"/><text x="103" y="54" font-family="Arial,sans-serif" font-size="20" fill="#fff">Controle | twee vensters, één Sheet</text><g font-family="Arial,sans-serif" fill="#173b5a"><rect x="60" y="94" width="355" height="183" rx="9" fill="#e8f2fb" stroke="#97b6cb"/><rect x="485" y="94" width="355" height="183" rx="9" fill="#e8f2fb" stroke="#97b6cb"/><text x="84" y="126" font-size="19" font-weight="bold">Venster 1: Uitlenen</text><text x="509" y="126" font-size="19" font-weight="bold">Venster 2: Vernieuwen</text><text x="84" y="169" font-size="22">Voorraad: 0</text><text x="509" y="169" font-size="22">Voorraad: 0</text><text x="84" y="213" font-size="19">Uitlenen gelukt</text><text x="509" y="213" font-size="19">Nogmaals: Niet beschikbaar</text><text x="508" y="246" font-size="17">Daarna terugbrengen: 1</text></g></svg>