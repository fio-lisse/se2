<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="t d"><title id="t">Code en HTML in één Apps Script-project</title><desc id="d">Een vereenvoudigd Apps Script-scherm met de bestanden Code.gs en Index.html en de plek waar de Sheet-ID wordt ingevuld.</desc><rect width="900" height="330" rx="18" fill="#f1f6fa"/><rect x="26" y="24" width="848" height="280" rx="12" fill="#fff" stroke="#a8bece" stroke-width="2"/><rect x="26" y="24" width="848" height="45" rx="12" fill="#173b5a"/><circle cx="52" cy="46" r="6" fill="#ffd447"/><circle cx="72" cy="46" r="6" fill="#8fc6e8"/><text x="103" y="54" font-family="Arial,sans-serif" font-size="20" fill="#fff">Apps Script | één project per team</text><g font-family="Arial,sans-serif" fill="#173b5a"><rect x="65" y="86" width="210" height="195" rx="7" fill="#e8f2fb"/><text x="84" y="118" font-size="21" font-weight="bold">Bestanden</text><text x="87" y="162" font-size="20">Code.gs</text><text x="87" y="205" font-size="20">Index.html</text><rect x="297" y="88" width="530" height="175" rx="7" fill="#102e48"/><text x="319" y="132" font-family="monospace" font-size="17" fill="#fff">const SPREADSHEET_ID = '...';</text><text x="319" y="175" font-family="monospace" font-size="17" fill="#ffd447">Vul hier jouw Sheet-ID in</text><text x="319" y="224" font-size="18" fill="#fff">Opslaan: Ctrl + S</text></g></svg>