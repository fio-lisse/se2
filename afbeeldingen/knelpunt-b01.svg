<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 188" role="img" aria-labelledby="titel uitleg">
  <title id="titel">Het knelpunt bij B01</title>
  <desc id="uitleg">Kwaliteit kan de grensproef pas afronden als Product in issue D zet dat bij voorraad nul de melding Niet beschikbaar verschijnt en de voorraad nul blijft.</desc>
  <defs>
    <marker id="pijl" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#315a79"/>
    </marker>
  </defs>
  <rect width="720" height="188" rx="12" fill="#f4f8fb"/>
  <g stroke-width="2" stroke="#315a79">
    <rect x="14" y="40" width="188" height="108" rx="9" fill="#fff1ce" stroke="#8f641c"/>
    <rect x="248" y="28" width="224" height="132" rx="9" fill="#e4f1ff"/>
    <rect x="518" y="40" width="188" height="108" rx="9" fill="#e6f4ed"/>
    <path d="M209 94h29m241 0h29" fill="none" marker-end="url(#pijl)"/>
  </g>
  <g fill="#163850" font-family="Arial, sans-serif" text-anchor="middle">
    <text x="108" y="76" font-weight="bold" font-size="22">Knelpunt</text>
    <text x="108" y="105" font-size="19">Wat moet er</text>
    <text x="108" y="129" font-size="19">gebeuren bij 0?</text>
    <text x="360" y="64" font-weight="bold" font-size="22">Product zet in D</text>
    <text x="360" y="98" font-size="19">‘Niet beschikbaar’</text>
    <text x="360" y="125" font-size="19">Voorraad blijft 0</text>
    <text x="612" y="76" font-weight="bold" font-size="22">Kwaliteit</text>
    <text x="612" y="105" font-size="19">Maakt de</text>
    <text x="612" y="129" font-size="19">grensproef af</text>
  </g>
</svg>
