<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d"><title id="t">Uitleenfunctie met blauw-geel balletje</title><desc id="d">Dezelfde blauw-gele bal gaat van leerling naar de uitleenfunctie. Uitlenen verandert voorraad 1 in 0; bij 0 lukt uitlenen niet; terugbrengen verandert 0 in 1.</desc><defs><clipPath id="ball"><circle cx="0" cy="0" r="18"/></clipPath></defs><rect width="900" height="300" fill="#fff"/><g font-family="Arial,sans-serif" fill="#173b5a"><g fill="#e8f2fb" stroke="#3478a8" stroke-width="3"><rect x="25" y="35" width="230" height="105" rx="8"/><rect x="335" y="35" width="230" height="105" rx="8"/><rect x="645" y="35" width="230" height="105" rx="8"/></g><g font-size="20" font-weight="bold" text-anchor="middle"><text x="140" y="80">Invoer (input)</text><text x="450" y="80">Regel (verwerking)</text><text x="760" y="80">Uitkomst (output)</text></g><g stroke="#3478a8" stroke-width="4" fill="none"><path d="M260 88h65m-12-10 12 10-12 10"/><path d="M570 88h65m-12-10 12 10-12 10"/></g><g font-size="18" text-anchor="middle"><text x="140" y="190">Actie: leen B01 uit</text><text x="450" y="180">Controleer voorraad</text><text x="450" y="207">en voer actie uit</text><text x="760" y="180">Nieuwe voorraad</text><text x="760" y="207">en melding</text></g><g transform="translate(140 245)"><circle r="23" fill="#173b5a"/><g clip-path="url(#ball)"><circle r="18" fill="#ffd447"/><path d="M-20 -10 Q-5 -23 3 -12 T20 -12 V-3 Q7 2-1-5T-20 4Z M-20 10Q-7-1 2 8t20-1v12h-42Z" fill="#2585c2"/></g></g><text x="450" y="270" text-anchor="middle" font-size="17">Uitlenen: 1 naar 0 | Niet beschikbaar: blijft 0 | Terugbrengen: 0 naar 1</text></g></svg>