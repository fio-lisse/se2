<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-labelledby="title desc">
  <title id="title">B01: Uitleenscherm in twee situaties</title>
  <desc id="desc">Bij voorraad 2 is de knop Leen één uit actief. Na de klik blijft één voetbal over en staat er Uitgeleend: Voetbal. Bij voorraad 1 is de knop uit en staat ernaast Laatste bal gereserveerd voor training.</desc>
  <style>
    text {font-family: Arial, sans-serif; fill: #182d25}
    .card {fill: #fff; stroke: #a8b7af; stroke-width: 2}
    .kicker {font-size: 21px; font-weight: 700; fill: #365a49}
    .title {font-size: 29px; font-weight: 700}
    .label {font-size: 24px; font-weight: 700}
    .body {font-size: 22px}
    .good {fill: #21533f}
    .button {font-size: 23px; font-weight: 700}
    .white {fill: #fff}
    .muted {fill: #43514a}
  </style>
  <rect width="900" height="360" rx="18" fill="#eef3f0"/>
  <rect x="16" y="16" width="426" height="328" rx="15" class="card"/>
  <rect x="458" y="16" width="426" height="328" rx="15" class="card"/>

  <text x="38" y="56" class="kicker">Situatie 1</text>
  <text x="38" y="97" class="title">B01: Voetbal</text>
  <text x="38" y="137" class="label">Voorraad: 2</text>
  <rect x="38" y="160" width="193" height="52" rx="8" fill="#21533f"/>
  <text x="134.5" y="193" class="button white" text-anchor="middle">Leen één uit</text>
  <text x="248" y="193" class="body good">Knop actief</text>
  <line x1="38" x2="419" y1="238" y2="238" stroke="#cbd7ce" stroke-width="2"/>
  <text x="38" y="272" class="label">Na de klik: voorraad 1</text>
  <text x="38" y="307" class="body">Uitgeleend: Voetbal.</text>

  <text x="480" y="56" class="kicker">Situatie 2</text>
  <text x="480" y="97" class="title">B01: Voetbal</text>
  <text x="480" y="137" class="label">Voorraad: 1</text>
  <rect x="480" y="160" width="170" height="52" rx="8" fill="#e3e8e5" stroke="#a8b7af" stroke-width="2"/>
  <text x="565" y="193" class="button muted" text-anchor="middle">Leen één uit</text>
  <text x="667" y="169" class="body"><tspan x="667">Laatste bal</tspan><tspan x="667" dy="25">gereserveerd</tspan><tspan x="667" dy="25">voor training.</tspan></text>
  <line x1="480" x2="861" y1="238" y2="238" stroke="#cbd7ce" stroke-width="2"/>
  <text x="480" y="272" class="label">Knop uit, voorraad blijft 1</text>
</svg>
