<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" role="img" aria-labelledby="titel uitleg">
  <title id="titel">Plan voor twee proeven</title>
  <desc id="uitleg">Start bij 1 en kies Uitlenen. Verwacht Gelukt en voorraad 0. Start bij 0 en kies Uitlenen. Verwacht Niet beschikbaar en voorraad 0.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #182d25 }
    .kop { font-weight: 700; font-size: 30px }
    .kopkolom { font-weight: 700; font-size: 21px; fill: #fff }
    .basis { font-size: 21px }
  </style>
  <rect width="920" height="300" rx="16" fill="#eef3f0"/>
  <text x="24" y="47" class="kop">Plan voor twee proeven</text>
  <rect x="24" y="79" width="872" height="158" rx="8" fill="#fff" stroke="#a8b7af"/>
  <path d="M32 79H888Q896 79 896 87V120H24V87Q24 79 32 79Z" fill="#21533f"/>
  <text x="37.0" y="107" class="kopkolom">Beginstand</text>
  <text x="255.0" y="107" class="kopkolom">Handeling</text>
  <path d="M242.0 120V237" stroke="#cbd7ce"/>
  <text x="473.0" y="107" class="kopkolom">Verwachte melding</text>
  <path d="M460.0 120V237" stroke="#cbd7ce"/>
  <text x="691.0" y="107" class="kopkolom">Verwachte stand</text>
  <path d="M678.0 120V237" stroke="#cbd7ce"/>
  <path d="M24 178H896" stroke="#cbd7ce"/>
  <text x="37.0" y="155" class="basis">Voorraad 1</text>
  <text x="255.0" y="155" class="basis">Uitlenen</text>
  <text x="473.0" y="155" class="basis">Gelukt</text>
  <text x="691.0" y="155" class="basis">0</text>
  <text x="37.0" y="210" class="basis">Voorraad 0</text>
  <text x="255.0" y="210" class="basis">Uitlenen</text>
  <text x="473.0" y="210" class="basis">Niet beschikbaar</text>
  <text x="691.0" y="210" class="basis">0</text>
  <text x="24" y="276" class="basis">Zet de afgesproken beginstand terug vóór elke proef.</text>
</svg>
