    <text x="286.5" y="64" font-size="21" font-weight="bold">Run</text>
    <text x="286.5" y="89" font-size="17">Voer uit</text>
    <path d="M360 73 L403 73" fill="none" stroke="#315a79" stroke-width="2" marker-end="url(#pijl)"/>
    <rect x="410" y="36" width="137" height="74" rx="8" fill="#e4f1ff" stroke="#315a79" stroke-width="2"/>
