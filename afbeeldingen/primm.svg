<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 145" role="img" aria-labelledby="titel uitleg">
  <title id="titel">Vijf stappen van PRIMM</title>
  <desc id="uitleg">Predict: voorspel. Run: voer uit. Investigate: onderzoek. Modify: pas aan. Make: maak iets eigens.</desc>
