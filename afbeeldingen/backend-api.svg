<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="t d"><title id="t">API voor het uitlenen van één blauw-geel balletje</title><desc id="d">Hetzelfde blauw-gele balletje bij het scherm, de API en de database. GET leest de voorraad. POST uitlenen verandert 1 naar 0, weigert bij 0; terugbrengen verandert 0 naar 1.</desc><defs><clipPath id="ball"><circle cx="0" cy="0" r="14"/></clipPath></defs><rect width="900" height="340" fill="#fff"/><g font-family="Arial,sans-serif" fill="#173b5a"><g fill="#e8f2fb" stroke="#3478a8" stroke-width="3"><rect x="25" y="30" width="230" height="95" rx="8"/><rect x="335" y="30" width="230" height="95" rx="8"/><rect x="645" y="30" width="230" height="95" rx="8"/></g><g font-size="23" font-weight="bold" text-anchor="middle"><text x="140" y="72">Scherm</text><text x="450" y="72">API</text><text x="760" y="72">Database</text></g><g font-size="16" text-anchor="middle"><text x="140" y="101">Leerling kiest actie</text><text x="450" y="101">Controleert voorraad</text><text x="760" y="101">Bewaart aantal ballen</text></g><g stroke="#3478a8" stroke-width="3" fill="none"><path d="M260 77h65m-10-8 10 8-10 8"/><path d="M570 77h65m-10-8 10 8-10 8"/></g><g transform="translate(760 158)"><circle r="18" fill="#173b5a"/><g clip-path="url(#ball)"><circle r="14" fill="#ffd447"/><path d="M-16-8Q-4-19 2-9t16-1v7Q7 2 0-4t-16 5ZM-16 8Q-5-1 2 6t16-1v12h-34Z" fill="#2585c2"/></g></g><g font-size="18"><text x="35" y="169">GET: kijk hoeveel balletjes er zijn</text><text x="35" y="202">POST: uitlenen bij 1 lukt, voorraad wordt 0</text><text x="35" y="235">POST: uitlenen bij 0 lukt niet, voorraad blijft 0</text><text x="35" y="268">POST: terugbrengen bij 0 lukt, voorraad wordt 1</text><text x="35" y="312">Er is steeds precies één uitleenballetje.</text></g></g></svg>