<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 306" role="img" aria-labelledby="titel uitleg">
  <title id="titel">POST vraagt uitlenen aan</title>
  <desc id="uitleg">POST geeft code B01 en de actie uitlenen door. Bij voorraad 1 verandert de stand naar 0. Bij voorraad 0 weigert de regel en blijft de stand 0.</desc>
  <defs>
    <marker id="pijl" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8z" fill="#315a79"/>
    </marker>
  </defs>
  <rect width="900" height="306" rx="12" fill="#fff"/>
  <g font-family="Arial, sans-serif">
    <text x="34" y="38" font-size="25" font-weight="700" fill="#173b5a" text-anchor="start">POST vraagt uitlenen aan</text>
    <rect x="34" y="113" width="254" height="85" rx="9" fill="#e8f2fb" stroke="#3478a8" stroke-width="2"/>
    <text x="50" y="142" font-size="20" font-weight="700" fill="#183247" text-anchor="start">POST /exec</text>
    <text x="50" y="169" font-size="17" font-weight="400" fill="#183247" text-anchor="start">Code B01, actie uitlenen.</text>
    <path d="M297 140 L414 102" fill="none" stroke="#315a79" stroke-width="2.4" marker-end="url(#pijl)"/>
    <path d="M297 169 L414 207" fill="none" stroke="#315a79" stroke-width="2.4" marker-end="url(#pijl)"/>
    <rect x="423" y="68" width="443" height="81" rx="9" fill="#e7f3ee" stroke="#2c765f" stroke-width="2"/>
    <text x="439" y="97" font-size="20" font-weight="700" fill="#183247" text-anchor="start">Voorraad 1</text>
    <text x="439" y="124" font-size="17" font-weight="400" fill="#183247" text-anchor="start">Gelukt. De nieuwe voorraad is 0.</text>
    <rect x="423" y="171" width="443" height="81" rx="9" fill="#f9ebe8" stroke="#9b4842" stroke-width="2"/>
    <text x="439" y="200" font-size="20" font-weight="700" fill="#183247" text-anchor="start">Voorraad 0</text>
    <text x="439" y="227" font-size="17" font-weight="400" fill="#183247" text-anchor="start">Niet beschikbaar. De voorraad blijft 0.</text>
    <text x="450" y="284" font-size="17" font-weight="400" fill="#3e586b" text-anchor="middle">De backend beslist of het verzoek een wijziging mag uitvoeren.</text>
  </g>
</svg>
