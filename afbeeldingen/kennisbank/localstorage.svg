<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 249" role="img" aria-labelledby="titel uitleg">
  <title id="titel">Dezelfde browser onthoudt zijn eigen stand</title>
  <desc id="uitleg">In browser A verandert de stand na uitlenen naar 0. Na verversen blijft die 0. In browser B begint de demo apart met 1.</desc>
  <defs>
    <marker id="pijl" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8z" fill="#315a79"/>
    </marker>
  </defs>
  <rect width="900" height="249" rx="12" fill="#fff"/>
  <g font-family="Arial, sans-serif">
    <text x="34" y="38" font-size="25" font-weight="700" fill="#173b5a" text-anchor="start">Dezelfde browser onthoudt zijn eigen stand</text>
    <rect x="34" y="65" width="380" height="130" rx="9" fill="#e7f3ee" stroke="#2c765f" stroke-width="2"/>
    <text x="50" y="94" font-size="20" font-weight="700" fill="#183247" text-anchor="start">Browser A</text>
    <text x="50" y="121" font-size="17" font-weight="400" fill="#183247" text-anchor="start">Uitlenen: 1 wordt 0.</text>
    <text x="50" y="144" font-size="17" font-weight="400" fill="#183247" text-anchor="start">Na verversen blijft de stand 0.</text>
    <text x="50" y="167" font-size="17" font-weight="400" fill="#183247" text-anchor="start">Die 0 zit in de lokale opslag van A.</text>
    <rect x="486" y="65" width="380" height="130" rx="9" fill="#e8f2fb" stroke="#3478a8" stroke-width="2"/>
    <text x="502" y="94" font-size="20" font-weight="700" fill="#183247" text-anchor="start">Browser B</text>
    <text x="502" y="121" font-size="17" font-weight="400" fill="#183247" text-anchor="start">Opent dezelfde MVP 2-demo.</text>
    <text x="502" y="144" font-size="17" font-weight="400" fill="#183247" text-anchor="start">Begint met stand 1.</text>
    <text x="502" y="167" font-size="17" font-weight="400" fill="#183247" text-anchor="start">Leest de lokale opslag van A niet.</text>
    <path d="M450 71 L450 189" fill="none" stroke="#9fb4c5" stroke-width="2"/>
    <text x="450" y="226" font-size="17" font-weight="400" fill="#3e586b" text-anchor="middle">localStorage bewaart gegevens per browser. Dit is geen gedeelde voorraad.</text>
  </g>
</svg>
