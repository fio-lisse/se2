<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 255" role="img" aria-labelledby="titel uitleg">
  <title id="titel">Voorraad kan wisselen tussen 1 en 0</title>
  <desc id="uitleg">Uitlenen brengt de voorraad van 1 naar 0. Terugbrengen gaat van 0 naar 1. Opnieuw uitlenen bij 0 wordt geweigerd.</desc>
  <defs>
    <marker id="pijl" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8z" fill="#315a79"/>
    </marker>
  </defs>
  <rect width="900" height="255" rx="12" fill="#fff"/>
  <g font-family="Arial, sans-serif">
    <text x="34" y="38" font-size="25" font-weight="700" fill="#173b5a" text-anchor="start">Voorraad kan wisselen tussen 1 en 0</text>
    <rect x="34" y="103" width="250" height="92" rx="9" fill="#e7f3ee" stroke="#2c765f" stroke-width="2"/>
    <text x="50" y="132" font-size="20" font-weight="700" fill="#183247" text-anchor="start">Voorraad 1</text>
    <text x="50" y="159" font-size="17" font-weight="400" fill="#183247" text-anchor="start">B01 is beschikbaar.</text>
    <rect x="616" y="103" width="250" height="92" rx="9" fill="#fff3d6" stroke="#87651b" stroke-width="2"/>
    <text x="632" y="132" font-size="20" font-weight="700" fill="#183247" text-anchor="start">Voorraad 0</text>
    <text x="632" y="159" font-size="17" font-weight="400" fill="#183247" text-anchor="start">B01 is uitgeleend.</text>
    <path d="M291 127 L606 127" fill="none" stroke="#315a79" stroke-width="2.4" marker-end="url(#pijl)"/>
    <path d="M608 172 L295 172" fill="none" stroke="#315a79" stroke-width="2.4" marker-end="url(#pijl)"/>
    <text x="450" y="110" font-size="17" font-weight="400" fill="#183247" text-anchor="middle">Uitlenen: 1 wordt 0</text>
    <text x="450" y="195" font-size="17" font-weight="400" fill="#183247" text-anchor="middle">Terugbrengen: 0 wordt 1</text>
    <text x="450" y="233" font-size="17" font-weight="400" fill="#3e586b" text-anchor="middle">Nogmaals uitlenen bij 0: Niet beschikbaar. De voorraad verandert niet.</text>
  </g>
</svg>
