<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 266" role="img" aria-labelledby="titel uitleg">
  <title id="titel">De team-README wijst naar het werk</title>
  <desc id="uitleg">De team-README linkt naar D, E, I en M. Bijdragen en bewijs staan als reacties onder het juiste hoofdissue.</desc>
  <defs>
    <marker id="pijl" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8z" fill="#315a79"/>
    </marker>
  </defs>
  <rect width="900" height="266" rx="12" fill="#fff"/>
  <g font-family="Arial, sans-serif">
    <text x="34" y="38" font-size="25" font-weight="700" fill="#173b5a" text-anchor="start">De team-README wijst naar het werk</text>
    <rect x="34" y="65" width="270" height="86" rx="9" fill="#e8f2fb" stroke="#3478a8" stroke-width="2"/>
    <text x="50" y="94" font-size="20" font-weight="700" fill="#183247" text-anchor="start">Team-README</text>
    <text x="50" y="121" font-size="17" font-weight="400" fill="#183247" text-anchor="start">Startpunt met de links.</text>
    <path d="M314 108 L407 108" fill="none" stroke="#315a79" stroke-width="2.4" marker-end="url(#pijl)"/>
    <rect x="416" y="65" width="450" height="144" rx="9" fill="#e7f3ee" stroke="#2c765f" stroke-width="2"/>
    <text x="434" y="94" font-size="18" font-weight="700" fill="#183247" text-anchor="start">D  Klantvraag en ontwerp</text>
    <text x="434" y="127" font-size="18" font-weight="700" fill="#183247" text-anchor="start">E  Bouw en eerste tests</text>
    <text x="434" y="160" font-size="18" font-weight="700" fill="#183247" text-anchor="start">I  Verbetering en hertests</text>
    <text x="434" y="193" font-size="18" font-weight="700" fill="#183247" text-anchor="start">M  Uitleg en samenwerking</text>
    <text x="450" y="244" font-size="17" font-weight="400" fill="#3e586b" text-anchor="middle">De rolbijdragen staan in de reacties. Een link naar code of commit wijst naar het bewijs.</text>
  </g>
</svg>
