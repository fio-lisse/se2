<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 294" role="img" aria-labelledby="titel uitleg">
  <title id="titel">Zo vind je bewijs bij Dark Reader</title>
  <desc id="uitleg">De README helpt je de demo te vinden. Issues tonen gesprekken, releases tonen versies en Actions toont automatische controles.</desc>
  <defs>
    <marker id="pijl" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8z" fill="#315a79"/>
    </marker>
  </defs>
  <rect width="900" height="294" rx="12" fill="#fff"/>
  <g font-family="Arial, sans-serif">
    <text x="34" y="38" font-size="25" font-weight="700" fill="#173b5a" text-anchor="start">Zo vind je bewijs bij Dark Reader</text>
    <rect x="34" y="104" width="229" height="89" rx="9" fill="#e8f2fb" stroke="#3478a8" stroke-width="2"/>
    <text x="50" y="133" font-size="20" font-weight="700" fill="#183247" text-anchor="start">README en demo</text>
    <text x="50" y="160" font-size="17" font-weight="400" fill="#183247" text-anchor="start">Bekijk wat het product</text>
    <text x="50" y="183" font-size="17" font-weight="400" fill="#183247" text-anchor="start">doet en hoe je het opent.</text>
    <path d="M272 149 L345 149" fill="none" stroke="#315a79" stroke-width="2.4" marker-end="url(#pijl)"/>
    <rect x="355" y="66" width="511" height="170" rx="9" fill="#e7f3ee" stroke="#2c765f" stroke-width="2"/>
    <text x="373" y="98" font-size="20" font-weight="700" fill="#183247" text-anchor="start">Drie plekken voor het projectwerk</text>
    <text x="373" y="135" font-size="18" font-weight="400" fill="#183247" text-anchor="start">Issues: volg vragen en verbeteringen.</text>
    <text x="373" y="171" font-size="18" font-weight="400" fill="#183247" text-anchor="start">Releases: bekijk wat per versie is uitgekomen.</text>
    <text x="373" y="207" font-size="18" font-weight="400" fill="#183247" text-anchor="start">Actions: bekijk de automatische controles.</text>
    <text x="450" y="272" font-size="17" font-weight="400" fill="#3e586b" text-anchor="middle">Voor B01 linkt de team-README op dezelfde manier naar werk en bewijs.</text>
  </g>
</svg>
