<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-labelledby="t d"><title id="t">Test de uitleenfunctie en verbeter deze</title><desc id="d">Test het blauw-gele balletje bij voorraad 1 en 0, verbeter één punt en test daarna dezelfde gewone en lastige situaties opnieuw. Terugbrengen zet 0 terug naar 1.</desc><defs><clipPath id="ball"><circle cx="0" cy="0" r="15"/></clipPath></defs><rect width="900" height="260" fill="#fff"/><g font-family="Arial,sans-serif" fill="#173b5a" text-anchor="middle"><g fill="#e8f2fb" stroke="#3478a8" stroke-width="3"><rect x="25" y="30" width="250" height="125" rx="8"/><rect x="325" y="30" width="250" height="125" rx="8"/><rect x="625" y="30" width="250" height="125" rx="8"/></g><g font-size="21" font-weight="bold"><text x="150" y="66">1. Testen</text><text x="450" y="66">2. Verbeteren</text><text x="750" y="66">3. Opnieuw testen</text></g><g font-size="16"><text x="150" y="99">Voorraad 1 naar 0: lukt</text><text x="150" y="125">Voorraad blijft 0: lukt niet</text><text x="450" y="105">Kies één punt</text><text x="750" y="99">Gewoon: 1 naar 0</text><text x="750" y="125">Lastig: 0 blijft 0</text></g><g transform="translate(450 133)"><circle r="19" fill="#173b5a"/><g clip-path="url(#ball)"><circle r="15" fill="#ffd447"/><path d="M-17-8Q-5-19 2-9t17-1v7Q7 2 0-4t-17 5ZM-17 8Q-5-1 2 6t17-1v12h-36Z" fill="#2585c2"/></g></g><g stroke="#3478a8" stroke-width="3" fill="none"><path d="M280 92h40m-9-8 9 8-9 8"/><path d="M580 92h40m-9-8 9 8-9 8"/></g><text x="450" y="210" font-size="17">Noteer verwachting en uitkomst. Gebruik dezelfde testgegevens opnieuw.</text></g></svg>